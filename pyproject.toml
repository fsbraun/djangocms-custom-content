[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "setuptools-scm" ]

[project]
name = "djangocms-custom-content"
description = "Developer framework for integrating custom content models with django CMS."
readme = "README.rst"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "Fabian Braun", email = "fsbraun@gmx.de" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Framework :: Django CMS",
  "Framework :: Django CMS :: 5.0",
  "Framework :: Django CMS :: 5.1",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  # 5.0 is supported; 5.1 adds GrouperModelAdmin.content_pk_url_param, without
  # which the toolbar settings link cannot name the version being viewed and
  # falls back to editing the latest content.
  "django-cms>=5",
]
# Named after the package it installs: versioning is optional, and
# djangocms-versioning is one implementation of it rather than the concept.
optional-dependencies.djangocms-versioning = [
  "djangocms-versioning>=2.3",
]
optional-dependencies.test = [
  "djangocms-custom-content[djangocms-versioning]",
  "pre-commit>=3",
  "pytest>=7",
  "pytest-cov>=5",
  "pytest-django>=4",
]
urls.Documentation = "https://djangocms-custom-content.readthedocs.io"
urls.Issues = "https://github.com/fsbraun/djangocms-custom-content/issues"
urls.Source = "https://github.com/fsbraun/djangocms-custom-content"

[tool.setuptools]
packages.find.where = [ "." ]
packages.find.include = [ "djangocms_custom_content*" ]
# Contrib apps ship their own templates, so every package contributes its template dir.
package-data."*" = [ "templates/**/*" ]
package-data.djangocms_custom_content = [ "LICENSE", "locale/**/*", "README.rst", "static/**/*" ]
dynamic.version = { attr = "djangocms_custom_content.__version__" }

[tool.black]
exclude = '''
  .git
  .hg
  .tox
  venv
  .venv
  _build
  build
  dist
'''

[tool.djlint]
profile = "django"
ignore = "H023,T003,H006,H031,D018,H021,H025"

[tool.ruff]
line-length = 119
exclude = [
  "**/migrations/**",
  ".env",
  ".venv",
]
lint.select = [
  "E",
  "F",
  "I",
  "W",
]
lint.ignore = [
  "E501", # line too long
  "E701", # multiple statements on one line (colon)
  "F401", # module imported but unused
  "F403", # 'from module import *' used; unable to detect undefined names
]

[tool.isort]
line_length = 119
multi_line_output = 5
include_trailing_comma = true
lines_after_imports = 2
sections = [
  "FUTURE",
  "STDLIB",
  "DJANGO",
  "CMS",
  "THIRDPARTY",
  "FIRSTPARTY",
  "LOCALFOLDER",
]
default_section = "THIRDPARTY"
known_first_party = "djangocms_custom_content"
skip = [
  "*migrations*",
  ".eggs",
  ".env",
  ".tox",
  ".venv",
  "data",
  "manage.py",
]
known_cms = [ "cms", "menus" ]
known_django = "django"

[tool.flake8]
max-line-length = 120
select = [
  "C",
  "E",
  "F",
  "W",
  "B",
  "B950",
]
ignore = [
  "W503", # line break before binary operator
]
exclude = [
  "*.egg-info",
  ".eggs",
  ".env",
  ".git",
  ".settings",
  ".tox",
  ".venv",
  "build",
  "data",
  "dist",
  "docs",
  "*migrations*",
  "requirements",
  "tmp",
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "." ]
ini_options.python_files = [ "test_*.py" ]
ini_options.DJANGO_SETTINGS_MODULE = "tests.test_settings"

[tool.coverage]
run.branch = true
run.omit = [
  "djangocms_custom_content/management/*",
  "djangocms_custom_content/migrations/*",
  "tests/*",
]
run.source = [ "djangocms_custom_content" ]
report.exclude_lines = [
  "def __repr__",
  "if __name__ == .__main__.:",
  "if 0:",
  "if self.debug:",
  "if settings.DEBUG",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise AssertionError",
  "raise NotImplementedError",
]
report.ignore_errors = true
