<div class="d-flex align-items-center p-4 border">
  <div class="flex-shrink-0">
    {% if person_content.visual %}
        <img class="img-fluid rounded-circle mr-4" style="width: 120px; border: 8px solid #9B5DE5;" src="{{ person_content.visual.url }}" alt="{{ instance.name }}">
    {% else %}
        <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
        <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
        </svg>
    {% endif %}
    </div>
    <div class="flex-grow-1 ms-3">
        <span class="text-info" style="font-weight: 600;">{{ person_content.role }}</span>
        <h4>{{ person_content.name }}</h4>
        <div class="text-secondary">{{ person_content.description }}</div>
    </div>
</div>
