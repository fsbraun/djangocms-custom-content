<div class="dcc-blogposts">
  {% for post in posts %}
    <article class="dcc-blogpost">
      <strong>{{ post.title }}</strong>
      {% if post.excerpt %}<div class="dcc-blogpost__excerpt">{{ post.excerpt }}</div>{% endif %}
    </article>
  {% empty %}
    <div class="dcc-blogposts__empty">No posts.</div>
  {% endfor %}
</div>
