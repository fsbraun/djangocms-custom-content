<div class="dcc-services">
  {% for service in services %}
    <div class="dcc-service">
      <strong>{{ service.title }}</strong>
      {% if service.summary %}<div class="dcc-service__summary">{{ service.summary }}</div>{% endif %}
    </div>
  {% empty %}
    <div class="dcc-services__empty">No featured services.</div>
  {% endfor %}
</div>
